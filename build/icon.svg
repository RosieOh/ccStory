<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Claude Vault app icon: the rail's brand mark (vault glyph on the brand gradient)
       on the macOS icon grid — 824px body in a 1024px canvas, room for the shadow.
       Regenerate the PNG/ICNS/ICO with `scripts/build-icons.sh`. -->
  <defs>
    <linearGradient id="body" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#6b98ff"/>
      <stop offset="0.48" stop-color="#2f6bf2"/>
      <stop offset="1" stop-color="#1a48c4"/>
    </linearGradient>
    <!-- Lit from the top, like the glass panels in the app. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#c9dbff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c9dbff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#0a2466" flood-opacity="0.38"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glyph-depth" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10" result="blur"/>
      <feFlood flood-color="#0b2a78" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- The `vault` glyph from src/ui.tsx (24-unit grid × 28.5, centred), redrawn at this
       size with rounder corners: a door, its dial and the two bolts. -->
  <g filter="url(#glyph-depth)">
    <rect x="284" y="284" width="456" height="456" rx="70" fill="#ffffff" fill-opacity="0.12"/>
    <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
      <rect x="284" y="284" width="456" height="456" rx="70"/>
      <circle cx="512" cy="512" r="86"/>
      <path d="M512 370v56M512 598v56"/>
    </g>
  </g>
</svg>

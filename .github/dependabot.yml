# Only what ships inside the app or runs the release: falling behind on these is a
# security problem (Electron patches only its latest three majors). Everything else is
# upgraded deliberately, not on a bot's schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # A new major waits 30 days (x.0.0 releases ship regressions; Electron's previous
    # major stays supported meanwhile). Patches inside a major still come within a week.
    cooldown:
      default-days: 7
      semver-major-days: 30
    allow:
      - dependency-name: electron
      - dependency-name: electron-updater
      - dependency-name: better-sqlite3
    groups:
      runtime:
        patterns: ['electron', 'electron-updater', 'better-sqlite3']
    commit-message:
      prefix: 'CHORE'
    labels: ['type: chore', 'area: security']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'CHORE'
    labels: ['type: chore', 'area: ci']

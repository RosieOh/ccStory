name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Tests run on every OS the installers target (paths, line endings, file locking differ);
  # typecheck, lint and the bundle build are OS-independent, so they run once.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No install scripts needed: better-sqlite3 ships N-API prebuilds that load in
      # Node and Electron alike, and nothing here launches Electron.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (main / preload / shared)
        if: runner.os == 'Linux'
        run: npx tsc -p tsconfig.node.json

      - name: Typecheck (renderer)
        if: runner.os == 'Linux'
        run: npx tsc -p tsconfig.json

      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: DB integration tests
        run: npm run test:db

      - name: Renderer build
        if: runner.os == 'Linux'
        run: npx vite build

  # Launches the built app against tests/e2e/fixtures and drives it (tests/e2e/smoke.mjs).
  # The only job that starts Electron, so it is the one that catches a broken main bundle,
  # worker path, preload or CSP.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Electron binary is fetched on first use by `require('electron')`.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build app bundles
        run: npx vite build

      - name: E2E smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: E2E smoke test
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-artifacts/
          if-no-files-found: ignore

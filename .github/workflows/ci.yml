name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No install scripts needed: better-sqlite3 ships N-API prebuilds that load in
      # Node and Electron alike, and nothing here launches Electron.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (main / preload / shared)
        run: npx tsc -p tsconfig.node.json

      - name: Typecheck (renderer)
        run: npx tsc -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: DB integration tests
        run: npm run test:db

      - name: Renderer build
        run: npx vite build

name: Release

# Builds signed installers for all three platforms and attaches them to a
# GitHub Release, which doubles as the electron-updater feed.
#
# Signing credentials come from repository secrets — see build/README.md for
# what to buy and how to export them. The build still succeeds without them,
# it just produces *unsigned* artifacts that trigger Gatekeeper/SmartScreen
# warnings, so treat a missing-secret run as a dry run only.

on:
  push:
    tags: ['v*']
  # Manual runs default to a dry run: installers are built on all three OSes but nothing
  # is published, and they are not uploaded as artifacts either (on a public repo an
  # artifact is a download anyone can fetch).
  workflow_dispatch:
    inputs:
      publish:
        description: 'never = dry run (build only), always = publish to a draft GitHub Release'
        type: choice
        options: [never, always]
        default: never

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A full install (with scripts) on the machines that package.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:db

      # electron-builder only packages what is already built (dist/, dist-electron/).
      - name: Build app bundles
        run: npx vite build

      - name: Package (and publish on a tag)
        shell: bash
        run: |
          # Secrets that are not configured arrive as empty strings, and electron-builder
          # reads an empty CSC_LINK as a path (the checkout) and fails. Unset them so a
          # build without signing secrets is a plain unsigned build.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --${{ matrix.platform }} --publish ${{ github.event_name == 'push' && 'always' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID cert + notarization (Apple Developer Program).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List installers
        shell: bash
        run: ls -la release | grep -vE '^(d|total)' || true

      - name: Upload artifacts
        if: github.event_name == 'push' || inputs.publish == 'always'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn

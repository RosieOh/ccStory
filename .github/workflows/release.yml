name: Release

# Builds signed installers for all three platforms and attaches them to a
# GitHub Release, which doubles as the electron-updater feed.
#
# Signing credentials come from repository secrets — see build/README.md for
# what to buy and how to export them. The build still succeeds without them,
# it just produces *unsigned* artifacts that trigger Gatekeeper/SmartScreen
# warnings, so treat a missing-secret run as a dry run only.

on:
  push:
    tags: ['v*']
  # Manual runs default to a dry run: installers are built on all three OSes but nothing
  # is published, and they are not uploaded as artifacts either (on a public repo an
  # artifact is a download anyone can fetch).
  workflow_dispatch:
    inputs:
      publish:
        description: 'never = dry run (build only), always = publish to a draft GitHub Release'
        type: choice
        options: [never, always]
        default: never

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A full install (with scripts) on the machines that package.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:db

      # electron-builder only packages what is already built (dist/, dist-electron/).
      - name: Build app bundles
        run: npx vite build

      - name: Package (and publish on a tag)
        shell: bash
        run: |
          # Secrets that are not configured arrive as empty strings, and electron-builder
          # reads an empty CSC_LINK as a path (the checkout) and fails. Unset them so a
          # build without signing secrets is a plain unsigned build.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          extra=''
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a Developer ID the bundle still needs a valid (ad-hoc) signature:
            # Electron's leftover linker signature makes a downloaded app "damaged", with
            # no way to open it. Ad-hoc code has no team ID, so it also needs
            # entitlements.mac.adhoc.plist (library validation off) or it will not start.
            # It cannot install updates either, so it is marked to skip the update check
            # (electron/updater.ts reads vault.unsignedMac from the packaged package.json).
            if [ "${{ matrix.platform }}" = mac ]; then
              extra='-c.mac.identity=- -c.mac.entitlements=build/entitlements.mac.adhoc.plist -c.mac.entitlementsInherit=build/entitlements.mac.adhoc.plist -c.extraMetadata.vault.unsignedMac=true'
            fi
          fi
          npx electron-builder --${{ matrix.platform }} --publish ${{ github.event_name == 'push' && 'always' || inputs.publish }} $extra
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID cert + notarization (Apple Developer Program).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # A broken bundle signature is invisible until someone downloads the app, and an
      # unsigned build that tries to self-update downloads 200 MB only to fail.
      - name: Verify macOS bundles
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for app in release/mac*/"ccStory.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            marker=$(node -e "const a=require('@electron/asar');console.log(JSON.parse(a.extractFile(process.argv[1],'package.json').toString()).vault?.unsignedMac===true)" "$app/Contents/Resources/app.asar")
            echo "$app: unsignedMac=$marker"
            if [ -z "${CSC_LINK:-}" ] && [ "$marker" != true ]; then echo "unsigned build is missing vault.unsignedMac"; exit 1; fi
          done
        env:
          # Empty unless signing is configured: then the bundle is Developer ID signed and unmarked.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: List installers
        shell: bash
        run: ls -la release | grep -vE '^(d|total)' || true

      - name: Upload artifacts
        if: github.event_name == 'push' || inputs.publish == 'always'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn
